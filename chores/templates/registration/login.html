{% extends "base.html" %}

{% block title %}Sign in · Usual Chores{% endblock %}

{% block content %}
<p><a href="{% url 'chores:list' %}">← Back to chores</a></p>
<h1>Sign in</h1>
<form method="post" class="form-card">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="button" type="submit">Sign in</button>
</form>
{% endblock %}
