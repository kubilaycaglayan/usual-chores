<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Usual Chores{% endblock %}</title><style>
:root{font-family:Georgia,serif;color:#26352c;background:#f6f1e8}body{max-width:960px;margin:0 auto;padding:2rem 1rem}a{color:#35634a}.page-header{display:flex;justify-content:space-between;align-items:end;margin-bottom:2rem}.eyebrow{color:#b0603b;text-transform:uppercase;letter-spacing:.12em;font:700 .75rem sans-serif}h1{font-size:clamp(2rem,5vw,4rem);margin:.2rem 0}.chore-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.chore-card,.form-card{background:#fffdf9;border:1px solid #dfd5c5;border-radius:12px;padding:1.25rem;box-shadow:0 4px 12px #57452b12}.chore-card.overdue{border-color:#c76b4c}.card-top,.actions{display:flex;justify-content:space-between;align-items:center;gap:1rem}.badge{font:700 .75rem sans-serif;background:#e4efe4;border-radius:99px;padding:.3rem .6rem}.overdue-label{color:#b34f30;font:700 .75rem sans-serif}.meta{color:#69756d;font: .9rem sans-serif}.actions{margin-top:1.25rem}.actions form{margin:0}button,.button{background:#35634a;color:white;border:0;border-radius:7px;padding:.65rem 1rem;font:600 .9rem sans-serif;text-decoration:none;cursor:pointer}.form-card{max-width:620px}.form-card p{display:flex;flex-direction:column;gap:.35rem;margin:1rem 0}.form-card input,.form-card textarea,.form-card select{font:inherit;padding:.6rem;border:1px solid #cfc4b4;border-radius:5px}.errorlist{color:#b34f30}.message{background:#e4efe4;padding:.75rem;border-radius:6px}.empty-state{font-size:1.2rem;color:#69756d}
</style></head><body><nav class="meta"><a href="{% url 'chores:list' %}">Chores</a> · <a href="{% url 'chores:households' %}">Households</a>{% if user.is_authenticated %} · {{ user.username }} · <a href="{% url 'logout' %}">Sign out</a>{% else %} · <a href="{% url 'login' %}">Sign in</a> · <a href="{% url 'chores:signup' %}">Sign up</a>{% endif %}</nav>{% block content %}{% endblock %}</body></html>
